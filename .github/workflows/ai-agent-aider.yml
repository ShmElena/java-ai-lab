name: AI Agent (Aider)

on:
  issues:
    types: [opened]

jobs:
  run-aider:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - run: pip install aider-chat

      - name: Write issue content to file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const issue = context.payload.issue
            const content = `${issue.title}\n\n${issue.body || ''}`
            fs.writeFileSync('/tmp/issue-task.txt', content)

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b aider/issue-${{ github.event.issue.number }}

      - name: Run Aider
        run: |
          aider --model gemini/gemini-3.8-flash \
                --yes \
                --no-suggest-shell-commands \
                --message "$(cat /tmp/issue-task.txt)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run tests
        run: mvn test

      - name: Push branch and create PR
        run: |
          git push origin aider/issue-${{ github.event.issue.number }}
          gh pr create \
            --title "Aider: ${{ github.event.issue.title }}" \
            --body "Closes #${{ github.event.issue.number }}" \
            --head "aider/issue-${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success'
            const msg = success
              ? 'Aider finished! PR opened.'
              : 'Aider failed — check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: msg
            })
